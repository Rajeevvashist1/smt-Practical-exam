<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="cart-container">
    <h1>Shopping Cart</h1>
    <div id="cart-content">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="cart-items"></tbody>
        </table>
      </div>
      <section class="summary">
        <p>Subtotal: <strong id="subtotal">Rs. 0.00</strong></p>
        <p id="discount-line">Discount (10% on Rs. 1000 or more): <strong id="discount">Rs. 0.00</strong></p>
        <p class="amount">Amount payable: <strong id="payable">Rs. 0.00</strong></p>
      </section>
    </div>
    <p id="empty-message" class="empty-message" hidden>Your cart is empty.</p>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
